[package]
name = "ck_lightning_client"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.23.0", features = ["full"] }
ldk-sample = { path = "../ic-lightning-relay" }
cklightning = { path = "../ckLightning-canister" }
nix = { version = "0.30.1", features = ["process"] }
candid = "=0.10.19"
anyhow = "1.0.100"
serde = "=1.0.219"
ic-agent = { version = "0.39.3", features = ["wasm-bindgen"] }
clap = { version = "4.5", features = ["derive"] }
ic-ledger-types = "0.15.0"
icrc-ledger-types = "0.1.10"
k256 = { version = "0.13.4"}
log = "0.4.29"
env_logger = "0.11.8"
bitcoin = { version = "0.32", features = ["rand"] }
strict_encoding = { version = "0.9.0", features = ["miniscript"] }
lightning-invoice = "0.33.0"
lightning = "0.0.113"
lnp-core = "0.9.2"
lnp_rpc = "0.9.1" 
hex = "0.4.3"

[profile.release]
overflow-checks = true

[build-dependencies]
microservices = { version = "0.9.0", default-features = false, features = ["peer", "shell"] }


